{{define "agents"}}
<section id="agents" class="mon tabpanel" role="tabpanel" aria-labelledby="tab-agents">
  <div class="mon-head">
    <h2>Agents</h2>
    <span class="aside" id="ag-sum">{{.AgentSummary}}</span>
    <span class="badge-sample" title="sample data: the live feed is unavailable, so this agent list is a placeholder">sample data</span>
  </div>
  <div class="sunken tree-wrap">
    <table class="tree" id="agents-table">
      <caption class="vh" id="ag-cap">agents working for me, from paseo. the column header buttons sort the table.</caption>
      <thead><tr>
        <th scope="col" data-key="name"><button type="button">Agent<span class="sort" aria-hidden="true"></span></button></th>
        <th scope="col" data-key="status" aria-sort="ascending"><button type="button">Status<span class="sort" aria-hidden="true"></span></button></th>
        <th scope="col" class="num" data-key="uptimeSec"><button type="button">Uptime<span class="sort" aria-hidden="true"></span></button></th>
        <th scope="col" data-key="task"><button type="button">Current task<span class="sort" aria-hidden="true"></span></button></th>
      </tr></thead>
      <tbody id="agents-body">
        {{range .Agents}}
        <tr>
          <td class="c-name"><svg class="ic" aria-hidden="true"><use href="#i-agent"/></svg>{{.Name}}</td>
          <td class="c-status"><span class="st st-{{.Status}}" aria-hidden="true"></span>{{.Status}}</td>
          <td class="c-up num" data-label="up">{{.Uptime}}</td>
          <td class="c-task">{{.Task}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
  <div class="mon-foot">
    <p id="ag-src">{{.AgentSource}}</p>
    <button type="button" class="btn" aria-disabled="true" title="read-only"><svg class="ic" aria-hidden="true"><use href="#i-stop"/></svg>End Process</button>
  </div>
</section>
{{end}}
